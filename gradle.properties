# === Plugin coordinates ===
# Override these via -PpluginVersion=... in CI for tagged releases.
pluginGroup=com.hestia
pluginName=HestiaBag
pluginVersion=0.1.2

# === Gradle daemon tuning ===
# 2GB heap is plenty for a project this size; bump if shadowJar starts to swap.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# === Java toolchain ===
# Auto-download JDK 25 from Adoptium if not found locally
org.gradle.java.installations.auto-download=true
