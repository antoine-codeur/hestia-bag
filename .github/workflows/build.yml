      #     game_endpoint: hytale         # ⚠️ verify the exact CurseForge endpoint slug
      #     file_path: build/libs/HestiaBag-${{ github.ref_name }}.jar
      #     changelog: ${{ github.event.head_commit.message }}
      #     release_type: beta
