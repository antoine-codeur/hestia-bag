name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manual trigger for re-running the build from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    name: Build plugin JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          # Hytale targets Java 25 (Project Loom virtual threads).
          # If Temurin 25 isn't available in setup-java when this runs,
          # fall back to 'oracle' which always tracks the latest GA.
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create HytaleServer.jar stub for CI compilation
        run: |
          # In CI (Linux), we can't access the Windows Hytale installation.
          # Create a minimal JAR with stub classes for compilation only.
          # This is placed in the project root where build.gradle.kts expects it.
          
          # Create temp directory for stub source
          mkdir -p stub-src/com/hypixel/hytale/server/core/plugin
          
          # Create stub base class with proper constructor signature
          cat > stub-src/com/hypixel/hytale/server/core/plugin/JavaPluginInit.java << 'EOF'
          package com.hypixel.hytale.server.core.plugin;
          public interface JavaPluginInit {}
          EOF
          
          cat > stub-src/com/hypixel/hytale/server/core/plugin/JavaPlugin.java << 'EOF'
          package com.hypixel.hytale.server.core.plugin;
          public abstract class JavaPlugin {
              public JavaPlugin(JavaPluginInit init) {}
              public void onEnable() {}
              public void onDisable() {}
          }
          EOF
          
          # Compile stubs
          mkdir -p stub-bin
          javac -d stub-bin stub-src/com/hypixel/hytale/server/core/plugin/*.java
          
          # Create the stub JAR (no manifest needed for compilation)
          cd stub-bin && jar cf ../HytaleServer.jar . && cd -
          
          # Verify it was created
          ls -lh HytaleServer.jar
          echo "✓ HytaleServer.jar stub created in project root"

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HestiaBag-plugin
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Release on tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download HytaleServer.jar (Local Build Artifact)
        run: |
          # GitHub Actions CI cannot access local Hytale installation.
          # This step is a placeholder: in production, HytaleServer.jar must be:
          # - Downloaded from Hytale's Maven repository (requires credentials), OR
          # - Committed to the repo (not recommended for large binaries), OR  
          # - Cached in GitHub Actions secrets
          #
          # For now, we assume the artifact from the 'build' job succeeded,
          # meaning HytaleServer.jar was available during that build.
          echo "Note: HytaleServer.jar must be available for full builds."

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

      # === CurseForge publication ===
      # Uncomment after creating the project on CurseForge and adding the secret
      # CURSEFORGE_TOKEN under Settings > Secrets and variables > Actions.
      #
