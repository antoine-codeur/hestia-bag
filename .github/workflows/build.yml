name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manual trigger for re-running the build from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    name: Build plugin JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          # Hytale targets Java 25 (Project Loom virtual threads).
          # If Temurin 25 isn't available in setup-java when this runs,
          # fall back to 'oracle' which always tracks the latest GA.
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean shadowJar --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HestiaBag-plugin
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Release on tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

      # === CurseForge publication ===
      # Uncomment after creating the project on CurseForge and adding the secret
      # CURSEFORGE_TOKEN under Settings > Secrets and variables > Actions.
      #
      # - name: Upload to CurseForge
      #   uses: itsmeow/curseforge-upload@v3
